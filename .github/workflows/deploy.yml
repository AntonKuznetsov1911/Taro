name: Deploy Taro to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fix-railway-deployment-*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Expo web for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          EXPO_PUBLIC_OFFLINE_MODE: 'true'
          EXPO_PUBLIC_BACKEND_URL: ''
        run: |
          cd frontend
          npx expo export --platform web

      - name: Create .nojekyll and 404.html for SPA routing
        run: |
          cd frontend/dist
          touch .nojekyll
          # Copy index.html to 404.html for SPA routing on GitHub Pages
          cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
