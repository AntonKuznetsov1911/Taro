<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0020"/>
    </linearGradient>

    <!-- Crystal ball gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#e8d5f5"/>
      <stop offset="20%" style="stop-color:#c9a6e0"/>
      <stop offset="45%" style="stop-color:#9b59b6"/>
      <stop offset="70%" style="stop-color:#6a3093"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </radialGradient>

    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="40%" style="stop-color:#d4a5ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0"/>
    </radialGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec8b"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>

    <!-- Stand gradient -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520"/>
      <stop offset="50%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>

    <!-- Mist/smoke effect -->
    <radialGradient id="mistGrad" cx="50%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#bb6bd9;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#9b59b6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Background stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="420" cy="80" r="1.5"/>
    <circle cx="450" cy="180" r="2"/>
    <circle cx="60" cy="200" r="1.5"/>
    <circle cx="100" cy="350" r="1"/>
    <circle cx="400" cy="380" r="2"/>
    <circle cx="150" cy="80" r="1"/>
    <circle cx="380" cy="120" r="1.5"/>
    <circle cx="70" cy="280" r="1"/>
    <circle cx="440" cy="300" r="1.5"/>
  </g>

  <!-- Sparkle stars -->
  <g fill="url(#goldGrad)" filter="url(#softGlow)">
    <polygon points="120,150 123,158 132,158 125,163 128,172 120,167 112,172 115,163 108,158 117,158"/>
    <polygon points="400,140 402,146 409,146 404,150 406,156 400,152 394,156 396,150 391,146 398,146"/>
    <polygon points="90,320 92,325 98,325 94,328 95,333 90,330 85,333 86,328 82,325 88,325"/>
    <polygon points="430,350 432,355 438,355 434,358 435,363 430,360 425,363 426,358 422,355 428,355"/>
  </g>

  <!-- Crystal ball stand base -->
  <ellipse cx="256" cy="400" rx="90" ry="20" fill="url(#standGrad)" filter="url(#shadow)"/>

  <!-- Stand neck -->
  <path d="M200,395 Q200,370 220,360 L292,360 Q312,370 312,395 Z" fill="url(#standGrad)"/>

  <!-- Stand ring -->
  <ellipse cx="256" cy="360" rx="50" ry="12" fill="url(#goldGrad)"/>
  <ellipse cx="256" cy="360" rx="42" ry="8" fill="#2d1b4e"/>

  <!-- Crystal ball shadow on stand -->
  <ellipse cx="256" cy="355" rx="70" ry="15" fill="#000" opacity="0.3"/>

  <!-- Main crystal ball -->
  <circle cx="256" cy="220" r="130" fill="url(#ballGrad)" filter="url(#shadow)"/>

  <!-- Ball inner glow/mist -->
  <circle cx="256" cy="230" r="100" fill="url(#mistGrad)"/>

  <!-- Mystical swirls inside -->
  <g stroke="#bb6bd9" stroke-width="2" fill="none" opacity="0.4">
    <path d="M200,200 Q230,180 260,200 Q290,220 280,250"/>
    <path d="M220,250 Q250,230 280,250 Q310,270 290,290"/>
    <path d="M240,180 Q260,200 240,220"/>
  </g>

  <!-- Stars inside the ball -->
  <g fill="#fff" filter="url(#glow)">
    <polygon points="230,190 232,196 239,196 234,200 236,206 230,202 224,206 226,200 221,196 228,196" opacity="0.9"/>
    <polygon points="280,230 282,234 287,234 283,237 284,241 280,238 276,241 277,237 273,234 278,234" opacity="0.7"/>
    <polygon points="250,260 251,263 255,263 252,265 253,268 250,266 247,268 248,265 245,263 249,263" opacity="0.6"/>
  </g>

  <!-- Main highlight on ball -->
  <ellipse cx="210" cy="175" rx="40" ry="25" fill="#fff" opacity="0.4" transform="rotate(-30 210 175)"/>
  <ellipse cx="205" cy="170" rx="25" ry="15" fill="#fff" opacity="0.6" transform="rotate(-30 205 170)"/>

  <!-- Secondary highlight -->
  <ellipse cx="300" cy="280" rx="15" ry="10" fill="#fff" opacity="0.15" transform="rotate(30 300 280)"/>

  <!-- Ball edge highlight -->
  <circle cx="256" cy="220" r="128" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Outer mystical ring -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Decorative corners -->
  <g fill="url(#goldGrad)" opacity="0.4">
    <path d="M50,50 L80,50 L80,55 L55,55 L55,80 L50,80 Z"/>
    <path d="M462,50 L432,50 L432,55 L457,55 L457,80 L462,80 Z"/>
    <path d="M50,462 L80,462 L80,457 L55,457 L55,432 L50,432 Z"/>
    <path d="M462,462 L432,462 L432,457 L457,457 L457,432 L462,432 Z"/>
  </g>
</svg>
